services:
  backend:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      # Was hardcoded to "development", which is not a harmless default: the CORS
      # handler in server.ts reflects ANY origin back when NODE_ENV is development.
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - AUTOMATION_PORT=3001
      - MAX_CONCURRENT_CAPTURES=${MAX_CONCURRENT_CAPTURES:-2}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_AUTH_TOKEN=${DATABASE_AUTH_TOKEN}
      # better-auth throws on boot in production without these.
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      # OmniRoute only — see "Models: OmniRoute only" in CLAUDE.md. Other provider
      # keys are deliberately not passed through; availableModels() ignores them
      # anyway, and having them here invites someone to re-enable the fallback.
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY}
      - OMNIROUTE_BASE_URL=${OMNIROUTE_BASE_URL}
      - OMNIROUTE_COMBO=${OMNIROUTE_COMBO:-vour-combos}
      - SLIDE_STORE_DIR=${SLIDE_STORE_DIR:-/data/slides}
      - PUBLIC_SLIDE_BASE=${PUBLIC_SLIDE_BASE:-https://cdn.vour.dev/slides}
      # Legacy: delete-only, for rows that still point at Cloudinary.
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - BUFFER_TOKEN=${BUFFER_TOKEN}
      # Without at least one channel, /automation/generate answers 500.
      - BUFFER_IG_CHANNEL_ID=${BUFFER_IG_CHANNEL_ID}
      - BUFFER_TIKTOK_CHANNEL_ID=${BUFFER_TIKTOK_CHANNEL_ID}
      - AUTOMATION_SECRET=${AUTOMATION_SECRET}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
    # nginx serves this same directory from the host, so the bytes never leave the box
    # to be published -- Buffer pulls them back through Cloudflare instead.
    volumes:
      - /var/lib/vour/slides:/data/slides
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
